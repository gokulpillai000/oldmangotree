  <!-- Slogan: Where ideas come to sit -->
  <text x="75" y="54" font-family="'DzainTrueCopy', 'Segoe UI', sans-serif" font-style="italic" font-size="11" letter-spacing="0.5" fill="#ea580c" font-weight="500">
